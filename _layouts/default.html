<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }}</title>
<meta name="description" content="{{ page.description | escape }}">
<meta property="og:title" content="{{ page.og_title | default: page.title | escape }}">
<meta property="og:description" content="{{ page.og_description | default: page.description | escape }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Savan Academy">
<meta property="og:image" content="{{ site.url }}/images/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Savan Academy: competition coaching for middle and high school students">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.og_title | default: page.title | escape }}">
<meta name="twitter:description" content="{{ page.og_description | default: page.description | escape }}">
<meta name="twitter:image" content="{{ site.url }}/images/og-image.png">
{% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "EducationalOrganization",
  "@id": "{{ site.url }}/#organization",
  "name": "Savan Academy",
  "url": "{{ site.url }}/",
  "logo": "{{ site.url }}/icon-512.png",
  "image": "{{ site.url }}/images/og-image.png",
  "description": "Competition coaching for middle and high school students: National Science Bowl, UIL, BPA, speech and debate, and AMC 8, 10 and 12."
}
</script>
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/index.css">
<link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
<script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
</head>
<body>
<div style="width:100%;background:#FFFFFF;color:#141B2D;font-family:'Inter',system-ui,sans-serif">

{% include nav.html %}

{{ content }}

</div>
</body>
</html>
